[project]
name = "euron-testforge"
version = "0.1.0"
description = "Python SDK and command line for Euron Open TestForge: import a project, generate tests with real assertions, run them in the sandbox and read coverage and failures."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
testforge-cli = "euron_testforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/euron_testforge"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
