# ─────────────────────────────────────────────────────────────────────────────
# Overlay: emulated AWS with Floci (https://github.com/floci-io/floci, MIT).
#
# The SAME Terraform that provisions real AWS (infra/terraform/modules) runs here
# against the emulator: the `terraform` one-shot applies infra/terraform/envs/local-floci
# (objects bucket, KMS key, secrets) before migrate, api, worker and scheduler start. They
# then use S3 and KMS exactly as they do on AWS:
#
#   sealed secrets  model provider keys, GitHub tokens and webhook secrets, sealed with KMS
#                   Encrypt (alias/testforge-local), encryption context bound to the record
#   objects         S3 bucket testforge-local-objects, SSE-KMS: uploaded ZIPs, source
#                   snapshots and exported reports
#
# The sandbox holds none of this: it stays on its own network with only its signing
# secret. The web app calls only the api, so it is unchanged. Mail stays in Mailpit.
# ─────────────────────────────────────────────────────────────────────────────
x-floci-env: &floci-env
  TESTFORGE_CLOUD: floci
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_ENDPOINT_URL: http://floci:4566
  S3_FORCE_PATH_STYLE: "true"
  STORAGE: s3
  OBJECTS_BUCKET: testforge-local-objects
  KEY_MODE: kms
  KMS_KEY_ID: alias/testforge-local

services:
  floci:
    image: floci/floci:2.3.0
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /data
    ports:
      - "127.0.0.1:${TESTFORGE_FLOCI_PORT:-5666}:4566"
    volumes:
      - flocidata:/data
      # Only Docker-backed emulated services (Lambda, ECS, RDS) need the Docker
      # socket. This stack uses S3, KMS and Secrets Manager, so it stays unmounted.
    networks:
      default:
        # The S3 Control API (bucket tagging) addresses <account-id>.<endpoint>, so the
        # emulated account's name has to resolve to the emulator as well.
        aliases: ["000000000000.floci"]

  # One-shot: provision the emulator with the production modules.
  terraform:
    image: hashicorp/terraform:1.16.6
    working_dir: /infra/terraform/envs/local-floci
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "waiting for floci..."
        until wget -q -O /dev/null http://floci:4566/; do sleep 1; done
        mkdir -p /tfdata/state
        terraform init -input=false -no-color >/dev/null
        # State lives in the tfdata volume, so it shares the emulator's lifecycle
        # (make down wipes both together).
        terraform apply -input=false -auto-approve -no-color -state=/tfdata/state/local.tfstate -var endpoint=http://floci:4566 -var cors_origins='["http://localhost:${TESTFORGE_WEB_PORT:-5610}","http://127.0.0.1:${TESTFORGE_WEB_PORT:-5610}"]'
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /tfdata
    volumes:
      - ../../infra:/infra
      - tfdata:/tfdata
    depends_on:
      - floci
    restart: "no"

  migrate:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

  api:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

  worker:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

  scheduler:
    environment:
      <<: *floci-env
    depends_on:
      terraform:
        condition: service_completed_successfully

volumes:
  flocidata:
  tfdata:
