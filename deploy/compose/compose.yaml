# Euron Open TestForge: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways.
#
# Host ports (override in .env if they clash with something you already run):
#   web 5610   api 5630   sandbox 5635   mailpit 5625   mock services 5650
#   postgres 5642   redis 5679   floci 5666
#
# Networks: the sandbox, the only service that executes code, sits on its own internal
# network ("sandbox") shared with the worker alone. It cannot reach Postgres, Redis, the
# API, Floci or the internet, and each run inside it has no network at all (nsjail).
name: testforge

x-server-build: &server-build
  context: ../../apps/api
  dockerfile: ../../infra/docker/server.Dockerfile

x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  ENVIRONMENT: development
  TESTFORGE_CLOUD: local
  LOG_LEVEL: ${TESTFORGE_LOG_LEVEL:-INFO}
  PORT: "8080"
  DATABASE_URL: postgresql+asyncpg://testforge:testforge@postgres:5432/testforge
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:?run `make env` first}
  API_KEY_PEPPER: ${API_KEY_PEPPER:?run `make env` first}
  LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?run `make env` first}
  SANDBOX_SECRET: ${SANDBOX_SECRET:?run `make env` first}
  SANDBOX_URL: http://sandbox:8080
  KEY_MODE: local
  STORAGE: local
  LOCAL_STORAGE_DIR: /data/objects
  WORK_DIR: /data/work
  COOKIE_SECURE: "false"
  # The dashboard container proxies /api with X-Forwarded-For; trust it on the Compose
  # network. On AWS this is the VPC CIDR.
  FORWARDED_ALLOW_IPS: "*"
  CORS_ORIGINS: http://localhost:${TESTFORGE_WEB_PORT:-5610},http://127.0.0.1:${TESTFORGE_WEB_PORT:-5610}
  PUBLIC_URL: http://localhost:${TESTFORGE_WEB_PORT:-5610}
  # Member notices land in Mailpit (http://localhost:5625).
  MAIL_BACKEND: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  # The demo's GitHub is the mock GitHub inside the mock services container (no network,
  # no token). Point GITHUB_API_URL at https://api.github.com to import real repositories.
  GITHUB_API_URL: ${TESTFORGE_GITHUB_API_URL:-http://mockai:5650/github}
  GITHUB_ALLOW_PRIVATE: "true"
  WEBHOOK_ALLOW_PRIVATE: "true"
  TESTFORGE_DEMO_PASSWORD: ${TESTFORGE_DEMO_PASSWORD:?run `make env` first}
  TESTFORGE_DEMO_MOCK_URL: http://mockai:5650

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: testforge
      POSTGRES_USER: testforge
      POSTGRES_PASSWORD: testforge
    ports:
      - "127.0.0.1:${TESTFORGE_PG_PORT:-5642}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testforge -d testforge"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Rate limits and the file index cache. Everything durable lives in Postgres.
  redis:
    image: redis:7.4.6-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${TESTFORGE_REDIS_PORT:-5679}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Catches mail locally (SMTP 1025, web UI on 5625).
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:${TESTFORGE_MAILPIT_PORT:-5625}:8025"
    restart: unless-stopped

  # Deterministic stand-ins: model providers in the OpenAI, Anthropic, Gemini and Ollama
  # wire formats, a GitHub API serving the demo repositories, and a webhook receiver.
  mockai:
    build:
      <<: *server-build
      target: api
    image: testforge-api:local
    entrypoint: ["/usr/bin/tini", "--"]
    command: ["uvicorn", "mockai.app:app", "--host", "0.0.0.0", "--port", "5650"]
    ports:
      - "127.0.0.1:${TESTFORGE_MOCKAI_PORT:-5650}:5650"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5650/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The sandbox service: the only place code runs. No privileges (every capability
  # dropped, no-new-privileges, the seccomp profile that lets nsjail build user
  # namespaces), read-only root, one run at a time, no credential but the request signing
  # secret, and a network that reaches the worker only.
  sandbox:
    build:
      context: ../../apps/api
      dockerfile: ../../infra/docker/sandbox.Dockerfile
      target: sandbox
    image: testforge-sandbox:local
    environment:
      LOG_LEVEL: ${TESTFORGE_LOG_LEVEL:-INFO}
      SANDBOX_SECRET: ${SANDBOX_SECRET:?run `make env` first}
      SANDBOX_CONCURRENCY: "1"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../../infra/docker/sandbox-seccomp.json
    read_only: true
    tmpfs:
      - /tmp:exec,size=1g,uid=10001,gid=10001
    pids_limit: 1024
    mem_limit: 3g
    cpus: 2
    networks: [sandbox]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The same sandbox, hardened the same way, for the integration suite on the host (make
  # test-integration): published on loopback port 5635 and alone on a network of its own,
  # since the stack's sandbox network is internal and cannot publish a port.
  sandbox-test:
    profiles: ["test"]
    image: testforge-sandbox:local
    environment:
      LOG_LEVEL: ${TESTFORGE_LOG_LEVEL:-INFO}
      SANDBOX_SECRET: ${SANDBOX_SECRET:?run `make env` first}
      SANDBOX_CONCURRENCY: "1"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=../../infra/docker/sandbox-seccomp.json
    read_only: true
    tmpfs:
      - /tmp:exec,size=1g,uid=10001,gid=10001
    pids_limit: 1024
    mem_limit: 3g
    cpus: 2
    networks: [sandbox-test]
    ports:
      - "127.0.0.1:${TESTFORGE_SANDBOX_PORT:-5635}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: testforge-api:local
    command: ["migrate"]
    environment:
      <<: *api-env
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mockai:
        condition: service_started
    restart: "no"

  api:
    image: testforge-api:local
    command: ["serve", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${TESTFORGE_API_PORT:-5630}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Imports and analysis, test generation (model calls), runs (through the sandbox).
  worker:
    image: testforge-api:local
    command: ["worker"]
    environment:
      <<: *api-env
      WORKER_CONCURRENCY: ${TESTFORGE_WORKER_CONCURRENCY:-4}
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    networks: [default, sandbox]
    # The worker serves no HTTP: it is healthy while its metrics endpoint answers.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9464/metrics', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    restart: unless-stopped

  # Periodic work: the lease reaper, webhook deliveries, retention.
  scheduler:
    image: testforge-api:local
    command: ["scheduler"]
    environment:
      <<: *api-env
      WORKER_METRICS_PORT: "0"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001
    volumes:
      - objects:/data/objects
      - work:/data/work
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    image: testforge-web:local
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
    ports:
      - "127.0.0.1:${TESTFORGE_WEB_PORT:-5610}:3000"
    read_only: true
    tmpfs:
      # The node user is uid 1000; Next writes its image cache under .next/cache.
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
  # Internal: no route out. The sandbox and the worker only.
  sandbox:
    internal: true
  sandbox-test:

volumes:
  pgdata:
  objects:
  work:
