[project]
name = "testforge"
version = "0.1.0"
description = "Euron Open TestForge: a self-hosted platform that analyzes a codebase, generates unit and API tests with real assertions, and runs every test in an unprivileged, network-isolated sandbox."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
# One package for the API, the worker, the scheduler and the sandbox service. The sandbox
# image installs it whole but holds no database, storage or provider credential at run time.
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "orjson>=3.10",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pyjwt>=2.10",
  "sqlalchemy[asyncio]>=2.1",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "argon2-cffi>=23.1",
  "boto3>=1.35",
  "cryptography>=43",
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
  "pyyaml>=6.0",
  "python-multipart>=0.0.20",
]

[project.scripts]
testforge = "testforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "boto3-stubs[s3,kms,secretsmanager]>=1.35",
  "asgi-lifespan>=2.1",
  "types-pyyaml>=6.0",
  # The SDK's tests run against the live test app.
  "euron-testforge",
]

[tool.uv.sources]
euron-testforge = { path = "../../sdk/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testforge", "src/mockai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Code that runs inside the sandbox on purpose: the demo projects (some of it buggy on
# purpose, to show a failure explained), hostile fixtures that try to escape, and the
# toolchain plugin, which runs under the sandbox's own Python.
extend-exclude = ["src/testforge/demo/projects", "tests/sandbox/hostile"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT"]
ignore = ["S101", "B008", "RUF012", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N803", "S105", "S106", "S108", "S311", "S603", "S608", "E501", "PT018", "PT022", "PT011", "S110", "ASYNC109"]
# Pytest style rules do not apply outside tests (asserts there narrow types).
"src/**" = ["PT"]
"src/testforge/migrations/**" = ["E501", "UP", "I"]
"src/mockai/**" = ["E501", "S311"]
"src/testforge/demo/**" = ["E501", "S311", "S105"]
# Generated test code is text built from templates, never executed by this process.
"src/testforge/generation/templates.py" = ["E501"]
"src/testforge/providers/adapters/mock.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["src/testforge/demo/projects/", "src/testforge/sandbox/toolchain/"]

[[tool.mypy.overrides]]
module = ["asgi_lifespan.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: needs Postgres, Redis, the mock service and the sandbox service (make test-integration)",
  "sandbox: runs inside the sandbox image with nsjail and the toolchains (make test-sandbox)",
]
addopts = "-ra"
# The demo projects carry their own tests; they run only inside the sandbox.
norecursedirs = ["src", ".venv", "node_modules", "hostile"]
# A test running longer than this gets every thread's stack dumped (it is not killed), so
# a hang shows where it waits instead of only that it waits.
faulthandler_timeout = 180

[tool.coverage.run]
source = ["testforge"]
branch = true
concurrency = ["greenlet", "thread"]
# The jail (nsjail) and the sandbox server run only inside the sandbox image, where
# make test-sandbox exercises them; the demo seed is exercised by make demo.
omit = ["*/migrations/*", "*/demo/*", "*/mockai/*", "*/sandbox/jail.py", "*/sandbox/server.py", "*/sandbox/toolchain/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true
