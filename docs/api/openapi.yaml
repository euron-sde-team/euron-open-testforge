components:
  schemas:
    Ack:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
        message:
          type: string
          title: Message
          default: ''
      type: object
      title: Ack
    AdminSettings:
      properties:
        site_name:
          type: string
          title: Site Name
        allow_signup:
          type: boolean
          title: Allow Signup
      type: object
      required:
      - site_name
      - allow_signup
      title: AdminSettings
    AnalysisOut:
      properties:
        import:
          anyOf:
          - $ref: '#/components/schemas/ImportOut'
          - type: 'null'
        units:
          type: integer
          title: Units
          default: 0
        by_kind:
          additionalProperties:
            type: integer
          type: object
          title: By Kind
        untested:
          type: integer
          title: Untested
          default: 0
        untested_units:
          items:
            $ref: '#/components/schemas/UnitOut'
          type: array
          title: Untested Units
      type: object
      title: AnalysisOut
      description: The project's current source analysis at a glance.
    AnalyzeRequest:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        case_id:
          type: string
          format: uuid
          title: Case Id
        use_model:
          type: boolean
          title: Use Model
          default: false
        provider_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Provider Id
      type: object
      required:
      - run_id
      - case_id
      title: AnalyzeRequest
    ApiKeyCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        scopes:
          items:
            type: string
            enum:
            - read
            - generate
