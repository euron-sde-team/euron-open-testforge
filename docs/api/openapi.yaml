openapi: 3.1.0
info:
  title: Euron Open TestForge
  description: "\nAPI of a self-hosted platform that writes and runs tests for your own code. Import a\
    \ GitHub\nrepository or a ZIP of a Python, JavaScript or TypeScript project; TestForge analyzes it\n\
    statically, generates unit, edge-case, negative and API tests whose assertions come from\nthe real\
    \ code, refuses any generated test without a meaningful assertion, and runs tests in\nan unprivileged\
    \ sandbox with no network, no credentials and a CPU, memory, output and wall\nclock budget. Failures\
    \ are explained from the values the same run captured; coverage is\nread from coverage.py and Istanbul,\
    \ never estimated.\n\n* People sign in with `POST /api/v1/auth/login` and send the session token as\n\
    \  `Authorization: Bearer <token>` (the dashboard uses an HttpOnly cookie instead).\n* Applications,\
    \ CI, the SDK and the CLI use a project API key: `Authorization: Bearer\n  tfk_...` or `X-API-Key:\
    \ tfk_...`. Scopes: `read`, `generate`, `execute`, `manage`.\n* The usual path: `POST .../imports/github`\
    \ (or `.../imports/zip`), `POST .../tests/generate`,\n  `PATCH .../tests/{id}` to accept, `POST .../runs`,\
    \ then `GET .../runs/{id}`. Every long call\n  takes `?wait=<seconds>` to return when the work is\
    \ done.\n"
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Sign in to the dashboard
      operationId: login_api_v1_auth_login_post
