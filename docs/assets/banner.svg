<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron Open TestForge</title>
  <desc id="d">Generate tests with real assertions from your own code and run them in a sandbox with no network: a self-hosted test generation and execution platform</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05140f"/>
      <stop offset="1" stop-color="#0a231a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#dots)"/>
  <circle cx="1030" cy="160" r="200" fill="url(#glow)"/>

  <g transform="translate(72 64)">
    <path d="M0 18 L18 0 H46 L64 18 V40 L46 58 H18 L0 40 Z" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <path d="M18 30 L28 40 L47 19" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="178" fill="#ecfdf5" font-size="54" font-weight="650" letter-spacing="-1.2">Euron Open TestForge</text>
    <text x="74" y="222" fill="#a7f3d0" font-size="22" font-weight="400">Tests with real assertions, run in a sandbox with no network.</text>
    <text x="74" y="266" fill="#6fbf9f" font-size="16" xml:space="preserve">Python and TypeScript  ·  pytest and Vitest  ·  measured coverage  ·  failures explained</text>
  </g>

  <g transform="translate(880 48)" font-family="JetBrains Mono, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="320" height="224" rx="14" fill="#0d2e22" stroke="#1b4a37"/>
    <circle cx="22" cy="20" r="5" fill="#f87171"/><circle cx="40" cy="20" r="5" fill="#fbbf24"/><circle cx="58" cy="20" r="5" fill="#34d399"/>
    <text x="80" y="25" fill="#6fbf9f" font-size="12">test_pricing.py</text>
    <text x="22" y="58" fill="#a7f3d0" font-size="14">def test_split_bill():</text>
    <text x="38" y="82" fill="#a7f3d0" font-size="14">shares = split_bill(100.0, 3)</text>
    <text x="38" y="106" fill="#d1fae5" font-size="14">assert sum(shares) == 100.0</text>
    <line x1="22" y1="124" x2="298" y2="124" stroke="#1b4a37"/>
    <text x="22" y="148" fill="#6fbf9f" font-size="12" xml:space="preserve">network: none   cpu: 60 s   mem: 1 GB</text>
    <rect x="22" y="166" width="96" height="30" rx="8" fill="url(#accent)"/>
    <text x="36" y="186" fill="#022c22" font-size="14" font-weight="700">12 passed</text>
    <rect x="128" y="166" width="78" height="30" rx="8" fill="#3b1d1d"/>
    <text x="140" y="186" fill="#fca5a5" font-size="14" font-weight="700">1 failed</text>
    <text x="218" y="186" fill="#6fbf9f" font-size="13">cov 87%</text>
  </g>
</svg>
