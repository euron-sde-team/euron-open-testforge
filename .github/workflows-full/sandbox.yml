name: sandbox

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sandbox:
    name: sandbox suite in the hardened image (isolation, limits, real runs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: make test-sandbox
