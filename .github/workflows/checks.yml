# Fast checks run on this repository: lint, typecheck and unit tests for the API and the
# web app, and the sanitization scan. The full pipeline (integration tests on Postgres,
# Redis, Floci and the sandbox, image builds, Terraform, security scans, e2e)
# lives in .github/workflows-full; enable it in your fork.
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize:
    name: sanitization (secrets, account ids, env files, dashes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-sanitization.sh

  api:
    name: api and SDK (ruff, mypy, pytest unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy --strict src
      - run: uv run ruff check ../../sdk/python/src && uv run ruff format --check ../../sdk/python/src
      - run: uv run mypy --strict ../../sdk/python/src
      # Unit tests only (no database). The 85% coverage floor applies to unit and
      # integration together, in workflows-full/ci.yml and make test-integration.
      - run: uv run pytest tests/unit -q

  web:
    name: web (eslint, tsc, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
